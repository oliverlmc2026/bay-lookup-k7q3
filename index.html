<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despatch Bays 口號查詢</title>
<style>
:root{--bg:#f6f6f3;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#e2e2dc;--ne:#f2c500;--ne-fg:#1c1c1a;--ts:#1f4e9c;--dl:#2f7d3a;--red:#c8231f;--gray:#c9c9c4}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--fg:#f1f1ec;--mut:#a3a39c;--card:#1f1f1d;--line:#34342f;--gray:#44443f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans TC",sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:0 0 12px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:5}
.search input{width:100%;font-size:18px;padding:14px 44px 14px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
.search input:focus{border-color:var(--ts)}
.search .wrap{position:relative}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:22px;padding:8px 12px;display:none;cursor:pointer}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
#results{display:grid;gap:10px;margin-bottom:18px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.res .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.res .nm{font-weight:700;font-size:17px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}
.chip.ne{background:var(--ne);color:var(--ne-fg)}.chip.ts{background:var(--ts)}.chip.dl{background:var(--dl)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.slot .t{font-size:12px;color:var(--mut)}
.slot .v{font-size:28px;font-weight:800;line-height:1.15}
.slot.g{background:var(--gray)}.slot.g .v{font-size:15px;font-weight:600;color:var(--mut);padding:8px 0}
.slot.r{border-color:var(--red)}.slot.r .v{font-size:15px;font-weight:700;color:var(--red);padding:8px 0}
.slot .q{font-size:11px;color:var(--mut);font-weight:400}
.none{color:var(--mut);padding:12px 2px}
section{margin-bottom:20px}
.sh{padding:8px 12px;border-radius:10px 10px 0 0;font-weight:800;letter-spacing:.3px}
.sh.ne{background:var(--ne);color:var(--ne-fg)}.sh.ts{background:var(--ts);color:#fff}.sh.dl{background:var(--dl);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-top:0}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}
th{font-size:12px;color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.n{font-weight:700}
td.g{background:var(--gray);color:var(--mut);font-size:12px}
td.g.car{font-size:15px;font-weight:700}
.slot.g.car .v{font-size:28px;font-weight:800;padding:0;color:var(--mut)}
.slot.g.car .q{font-size:11px;font-weight:400}
td.r{background:var(--red);color:#fff;font-size:12px}
tr.hit td{background:rgba(255,200,0,.22)}
tr.hit td.g{background:var(--gray)}tr.hit td.r{background:var(--red)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.clock{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.clock b{font-size:18px}
.clock input[type=time]{font-size:15px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.clock button{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
.cur{margin-left:auto;font-size:14px;color:var(--mut)}
.cur b{font-size:26px;color:var(--fg);margin-left:4px}
.slot.now{outline:3px solid var(--ts);outline-offset:1px}
.slot.dim{opacity:.55}
th.now{color:var(--fg);box-shadow:inset 0 -3px 0 var(--ts)}
td.now{box-shadow:inset 0 0 0 2px var(--ts)}
</style>
</head>
<body>
<h1>Despatch Bays 口號查詢</h1>
<div class="search">
  <div class="wrap">
    <input id="q" type="search" placeholder="輸入辦公室名，例如 Hexham" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clr" aria-label="清除">×</button>
  </div>
  <div class="clock"><span id="ctext"></span><input type="time" id="tm" aria-label="模擬時間"><button id="tnow">用現在時間</button></div>
  <div class="hint"><span class="dot"></span> = 07:20 仍派送 · 灰色 = 沿用前一格號碼 · 紅色 = 不派 · CD = CD 編號<br>每格號碼 = 喺該時間之前用；藍框 = 而家適用時段</div>
</div>
<div id="results"></div>
<div id="tables"></div>
<div class="note">資料來源：相片 IMG_2414 / IMG_2415（2026-11-18）。如現場有更新請以現場為準。</div>

<script>
const G='g',R='r';
const SECTIONS=[
 {id:'ne',title:'NE/SR Despatch Bays（黃色）',cols:['06:00','07:20','07:35'],t:[360,440,455],rows:[
  ['City DO',1,['16','16',R],'ne1 ne2 ne4 ne99 city'],
  ['Gosforth 3/13',0,['4',G,'4']],['West DO 5/15',0,['7',G,'7']],['Heaton 6/7',0,['12',G,'12']],
  ['Gateshead 8/10',0,['5',G,'5']],['Valley 9/11',0,['6',G,'6']],
  ['Forest Hall 12',0,['CD27',G,'CD27']],['Alnwick',0,['CD26',G,'CD26']],
  ['Ashington',0,['9',G,'9']],['Blaydon',0,['1',G,'1']],['Blyth',0,['CD23',G,'CD23']],
  ['Cramlington',0,['CD24',G,'CD24']],['Hexham',0,['17',G,'17']],['Jarrow',0,['11',G,'11']],
  ['Morpeth',0,['10',G,'10']],['North Shields',1,['2','2',R]],['North Tyneside',1,['2','2',R]],
  ['Peterlee',1,['CD22','CD22',R]],['Ponteland',0,['CD25',G,'CD25']],['Prudhoe',0,['6',G,'3']],
  ['Seaham',1,['CD21','CD21',R]],['South Shields',0,['18',G,'18']],['Sunderland',1,['3','3',R]],
  ['Wallsend',1,['2','2',R]],['Washington',0,['8',G,'8']],['Whitley Bay',1,['2','2',R]]
 ]},
 {id:'ts',title:'TS Despatch Bays（藍色）',cols:['01:00','05:15','07:20'],t:[60,315,440],rows:[
  ['Coulby',1,['13','13','11']],['Guisborough',1,['13','13','6']],['Hartlepool',1,['13','13','13']],
  ['Redcar',1,['13','13','8']],['Skelton',1,['13','13','7']],['Stockton',1,['13','14','12']],
  ['TS Artic',1,['13','13','10'],'ts 1-6 ts1 ts6']
 ]},
 {id:'dl',title:'DL/DH Despatch Bays（綠色）',cols:['01:00','05:15','07:20'],t:[60,315,440],rows:[
  ['Barnard Castle',1,['12','CD24','CD24']],['Bedale',1,['12','17','17']],['Bishop Auckland',1,['12','18','18']],
  ['Chester-Le-Street',1,['3','5','5']],['Consett',1,['15','15','15']],['Crook',1,['12','18','18']],
  ['Derwentside',1,['15','15','15']],['DL Artic',1,['12','12','9']],['Durham',1,['14','14','14']],
  ['Houghton-Le-Spring',1,['1','1','1']],['Leyburn',1,['CD','CD23','CD23']],['Newton Aycliffe',1,['12','CD','CD']],
  ['Northallerton',1,['12','17','17']],['Richmond',1,['12','4','4']],['Spennymoor',1,['12','19','CD']],
  ['Stanley',1,['15','15','15']],['Wear Valley',1,['12','18','18']]
 ]}
];
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const squash=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');

function eff(a,i){while(i>0&&a[i]===G)i--;return a[i]}
function cellHTML(v,isNow,c){const n=isNow?' now':'';
  if(v===G) return `<td class="g car${n}">${c}</td>`;
  if(v===R) return `<td class="r${n}">不派</td>`;
  return `<td class="n${n}">${v}</td>`;
}
function slotHTML(label,v,isNow,anyNow,c){const x=(isNow?' now':'')+(anyNow&&!isNow?' dim':'');
  if(v===G) return `<div class="slot g car${x}"><div class="t">${label}</div><div class="v">${c}<span class="q"> 沿用</span></div></div>`;
  if(v===R) return `<div class="slot r${x}"><div class="t">${label}</div><div class="v">不派</div></div>`;
  return `<div class="slot${x}"><div class="t">${label}</div><div class="v">${v}</div></div>`;
}
function matches(row,q){
  if(!q) return false;
  const nq=norm(q), sq=squash(q);
  const hay=norm(row[0]+' '+(row[3]||'')), hs=squash(row[0]+(row[3]||''));
  return hay.includes(nq)||hs.includes(sq);
}
let manual=null;
function londonMins(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const h=+p.find(x=>x.type==='hour').value%24,m=+p.find(x=>x.type==='minute').value;return h*60+m}
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function activeIdx(s,now){for(let i=0;i<s.t.length;i++) if(now<s.t[i]) return i;return -1}
function curText(v){return (v===G||v===R)?'不派':v}
function render(){
  const now=manual!==null?manual:londonMins();
  $('#ctext').innerHTML=(manual!==null?'模擬時間 ':'英國時間 ')+'<b>'+fmt(now)+'</b>';
  if(manual===null) $('#tm').value=fmt(now);
  const q=$('#q').value;
  $('#clr').style.display=q?'block':'none';
  const hits=[];
  let tables='';
  for(const s of SECTIONS){
    const act=activeIdx(s,now);
    let body='';
    for(const r of s.rows){
      const m=matches(r,q);
      if(m) hits.push({s,r});
      if(q&&!m) continue;
      body+=`<tr class="${m?'hit':''}"><td>${r[1]?'<span class="dot"></span> ':''}${r[0]}</td>${r[2].map((v,i)=>cellHTML(v,i===act,eff(r[2],i))).join('')}</tr>`;
    }
    if(!body) continue;
    tables+=`<section><div class="sh ${s.id}">${s.title}</div><table><thead><tr><th>Delivery Office</th>${s.cols.map((c,i)=>`<th class="${i===act?'now':''}">${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></section>`;
  }
  $('#tables').innerHTML=tables;
  const res=$('#results');
  if(!q){res.innerHTML='';return}
  if(!hits.length){res.innerHTML='<div class="none">搵唔到，試吓打少啲字（例如 only「gates」）。</div>';return}
  res.innerHTML=hits.slice(0,8).map(({s,r})=>{const act=activeIdx(s,now);
    const cur=act<0?'<span class="cur">已過最後時段</span>':`<span class="cur">而家<b>${curText(eff(r[2],act))}</b></span>`;
    return `<div class="res"><div class="top"><span class="nm">${r[0]}</span><span class="chip ${s.id}">${s.id.toUpperCase()}</span>${r[1]?'<span class="dot" title="07:20 仍派送"></span>':''}${cur}</div>
    <div class="slots">${r[2].map((v,i)=>slotHTML(s.cols[i],v,i===act,act>=0,eff(r[2],i))).join('')}</div></div>`}).join('');
}
$('#q').addEventListener('input',render);
$('#clr').addEventListener('click',()=>{$('#q').value='';render();$('#q').focus()});
$('#tm').addEventListener('input',e=>{const v=e.target.value;if(!v)return;const [h,m]=v.split(':').map(Number);manual=h*60+m;render()});
$('#tnow').addEventListener('click',()=>{manual=null;render()});
setInterval(()=>{if(manual===null)render()},30000);
render();
</script>
</body>
</html>
